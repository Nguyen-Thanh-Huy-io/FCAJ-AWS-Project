version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: publicast_mysql
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: publicast
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: publicast_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: publicast_backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://user:user_password@mysql:3306/publicast
      REDIS_URL: redis://redis:6379
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: publicast_frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
