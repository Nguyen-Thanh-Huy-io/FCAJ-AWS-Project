*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1rem 0}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem}
.btn{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.btn.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}
.btn:hover:not(.active){background:var(--color-background-secondary)}
.classes{display:flex;flex-direction:column;gap:14px}
.cls-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.cls-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--color-border-tertiary)}
.cls-name{font-size:14px;font-weight:500;color:var(--color-text-primary);font-family:var(--font-mono)}
.cls-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:400}
.cls-note{font-size:12px;color:var(--color-text-tertiary);margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 14px;font-weight:500;font-size:11px;color:var(--color-text-secondary);background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);letter-spacing:.03em;text-transform:uppercase}
td{padding:6px 14px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.fn{font-family:var(--font-mono);font-size:12px;color:var(--color-text-primary)}
.ftype{font-family:var(--font-mono);font-size:11.5px}
.req{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500}
.fdesc{color:var(--color-text-secondary);font-size:12px}
.hidden{display:none}
.enum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:10px 14px}
.enum-val{font-family:var(--font-mono);font-size:12px;padding:4px 8px;border-radius:4px;background:var(--color-background-secondary);color:var(--color-text-primary)}
.sep{height:1px;background:var(--color-border-tertiary);margin:4px 0}
</style>

const filters=document.getElementById('filters');
const container=document.getElementById('classes');
let activeCat='all';

function badge(cat){
  const c=CATS[cat];
  return `<span class="cls-badge" style="background:${c.bg};color:${c.text}">${c.label}</span>`;
}

function reqBadge(req){
  if(req) return `<span class="req" style="background:#E1F5EE;color:#085041">required</span>`;
  return `<span class="req" style="background:#F1EFE8;color:#444441">optional</span>`;
}

function renderClass(item){
  if(item.isEnum){
    return `<div class="cls-card" data-cat="${item.cat}">
      <div class="cls-header">
        <span class="cls-name">Enumerations</span>
        ${badge(item.cat)}
      </div>
      ${item.enums.map(e=>`
        <div style="padding:8px 14px;border-bottom:0.5px solid var(--color-border-tertiary)">
          <div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;font-family:var(--font-mono)">${e.name}</div>
          <div class="enum-grid" style="padding:0">
            ${e.vals.map(v=>`<span class="enum-val">${v}</span>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>`;
  }
  return `<div class="cls-card" data-cat="${item.cat}">
    <div class="cls-header">
      <span class="cls-name">${item.id}</span>
      ${badge(item.cat)}
      ${item.note?`<span class="cls-note">${item.note}</span>`:''}
    </div>
    <table>
      <thead><tr>
        <th style="width:180px">Tên trường</th>
        <th style="width:110px">Kiểu dữ liệu</th>
        <th style="width:88px">Ràng buộc</th>
        <th>Mô tả</th>
      </tr></thead>
      <tbody>
        ${item.fields.map(f=>`<tr>
          <td class="fn">${f.n}</td>
          <td class="ftype" style="color:var(--color-text-info)">${f.t}</td>
          <td>${reqBadge(f.req)}</td>
          <td class="fdesc">${f.d}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function render(){
  container.innerHTML=DATA
    .filter(d=>activeCat==='all'||d.cat===activeCat)
    .map(renderClass).join('');
}

const allCats=[{id:'all',label:'Tất cả'},...Object.entries(CATS).map(([id,v])=>({id,label:v.label}))];
allCats.forEach(c=>{
  const b=document.createElement('button');
  b.className='btn'+(c.id==='all'?' active':'');
  b.textContent=c.label;
  b.onclick=()=>{
    activeCat=c.id;
    document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  filters.appendChild(b);
});
render();
</script>
