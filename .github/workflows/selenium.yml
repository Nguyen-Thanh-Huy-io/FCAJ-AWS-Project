name: Selenium UI Automation Tests

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: publicast
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Setup backend database schema and seed
      - name: Setup Backend Database
        working-directory: backend
        run: |
          npm install
          npx prisma db push
          # Nếu có db seed thì chạy ở đây, e.g. npx prisma db seed

      - name: Start Backend Server
        working-directory: backend
        env:
          PORT: 3000
          DATABASE_URL: mysql://root:root_password@localhost:3307/publicast
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          USE_MEMORY_REDIS: false
          JWT_SECRET: test_secret_key
          ACCESS_TOKEN_SECRET: test_access_token_secret
          REFRESH_TOKEN_SECRET: test_refresh_token_secret
          FRONTEND_URL: http://localhost:5173
        run: |
          npm run dev &
        # & chạy backend trong background

      - name: Start Frontend App
        working-directory: frontend
        run: |
          npm install
          npm run dev &

      # Install and run Selenium Webdriver environment
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Selenium Test Dependencies
        working-directory: test_selenium
        run: |
          npm install

      - name: Run Selenium Tests
        working-directory: test_selenium
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MYSQL_URL: mysql://root:root_password@127.0.0.1:3307/publicast
          BASE_URL: http://localhost:5173
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          npm run test:auth-suite

      - name: Upload Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: test_cases/auth/screenshots/
